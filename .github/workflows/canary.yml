name: Canary Builds

on:
  push:
    branches: [canary]
  pull_request:
    branches: [canary]

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: ilammy/setup-nasm@v1
      - name: Install FFmpeg codec dependencies
        run: |
          vcpkg install pkgconf:x64-windows ffnvcodec:x64-windows x264:x64-windows x265:x64-windows svt-av1:x64-windows
          echo "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/tools/pkgconf" >> $env:GITHUB_PATH
          echo "PKG_CONFIG_PATH=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/lib/pkgconfig" >> $env:GITHUB_ENV
          echo "PKG_CONFIG=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/tools/pkgconf/pkgconf.exe" >> $env:GITHUB_ENV
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: beam-windows-x64
          path: target/release/beam.exe

  linux-wayland-x64:
    name: Linux x64 Wayland
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FFmpeg/nv-codec-headers
          ref: n13.0.19.0
          path: .ci/nv-codec-headers
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang cmake nasm pkg-config \
            libx264-dev libx265-dev libsvtav1-dev libsvtav1enc-dev \
            libva-dev \
            libgtk-3-dev libayatana-appindicator3-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libwayland-dev libxkbcommon-dev \
            libx11-dev libxtst-dev libxdo-dev
          sudo make -C .ci/nv-codec-headers install
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          pkg-config --modversion SvtAv1Enc
          pkg-config --cflags --libs SvtAv1Enc
          PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig pkg-config --modversion ffnvcodec
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: beam-linux-wayland-x64
          path: target/release/beam

  macos-arm64:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake
        run: brew install cmake pkg-config x264 x265 svt-av1
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - run: cargo install cargo-bundle --version 0.11.0 --locked
      - run: cargo bundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: beam-macos-arm64
          path: |
            target/release/bundle/osx/Beam.app
            target/release/bundle/dmg/Beam.dmg
