name: Canary Builds

on:
  push:
    branches: [canary]
  pull_request:
    branches: [canary]

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 3723ec118c8354290925feb58d021a9205a3e772
          path: .vcpkg
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build static FFmpeg dependencies
        shell: pwsh
        run: ./scripts/bootstrap-ffmpeg.ps1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - run: cargo build --release --locked
      - name: Verify FFmpeg is statically linked
        shell: pwsh
        run: |
          $dependencies = (dumpbin /dependents target/release/beam.exe) -join "`n"
          $dependencies
          if ($dependencies -match '(?i)(avcodec|avfilter|avformat|avutil|swscale|x264|x265|SvtAv1Enc).*\.dll') {
            throw "beam.exe has a dynamic FFmpeg or codec dependency"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: beam-windows-x64
          path: target/release/beam.exe

  linux-wayland-x64:
    name: Linux x64 Wayland
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 3723ec118c8354290925feb58d021a9205a3e772
          path: .vcpkg
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang cmake nasm pkg-config \
            libgtk-3-dev libayatana-appindicator3-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libwayland-dev libxkbcommon-dev \
            libx11-dev libxtst-dev libxdo-dev
      - name: Build static FFmpeg dependencies
        run: ./scripts/bootstrap-ffmpeg.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - run: cargo build --release --locked
      - name: Verify FFmpeg is statically linked
        run: |
          dependencies="$(ldd target/release/beam)"
          echo "$dependencies"
          ! grep -Eiq 'lib(avcodec|avfilter|avformat|avutil|swscale|x264|x265|SvtAv1Enc).*\.so' <<< "$dependencies"
      - uses: actions/upload-artifact@v4
        with:
          name: beam-linux-wayland-x64
          path: target/release/beam

  macos-arm64:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 3723ec118c8354290925feb58d021a9205a3e772
          path: .vcpkg
      - name: Install native dependencies
        run: brew install pkg-config
      - name: Build static FFmpeg dependencies
        run: ./scripts/bootstrap-ffmpeg.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - run: cargo install cargo-bundle --version 0.11.0 --locked
      - run: cargo bundle --release
      - name: Verify FFmpeg is statically linked
        run: |
          binary=target/release/bundle/osx/Beam.app/Contents/MacOS/Beam
          dependencies="$(otool -L "$binary")"
          echo "$dependencies"
          ! grep -Eiq 'lib(avcodec|avfilter|avformat|avutil|swscale|x264|x265|SvtAv1Enc).*\.dylib' <<< "$dependencies"
      - uses: actions/upload-artifact@v4
        with:
          name: beam-macos-arm64
          path: |
            target/release/bundle/osx/Beam.app
            target/release/bundle/dmg/Beam.dmg
