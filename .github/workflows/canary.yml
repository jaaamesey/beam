name: Canary Builds

on:
  push:
    branches: [canary]
  pull_request:
    branches: [canary]

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: beam-windows-x64
          path: target/release/beam.exe

  linux-wayland-x64:
    name: Linux x64 Wayland
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang cmake pkg-config \
            libgtk-3-dev libayatana-appindicator3-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libwayland-dev libxkbcommon-dev \
            libx11-dev libxtst-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: beam-linux-wayland-x64
          path: target/release/beam

  macos-arm64:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake
        run: brew install cmake
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - run: cargo install cargo-bundle --version 0.11.0 --locked
      - run: cargo bundle --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: beam-macos-arm64
          path: |
            target/release/bundle/osx/Beam.app
            target/release/bundle/dmg/Beam.dmg
