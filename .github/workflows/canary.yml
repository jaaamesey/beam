name: Canary Builds

on:
  push:
    branches: [canary]
  pull_request:
    branches: [canary]

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 3723ec118c8354290925feb58d021a9205a3e772
          path: .vcpkg
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Select project-local vcpkg
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE\.vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_TRIPLET=x64-windows-static-md-release" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build static FFmpeg dependencies
        shell: pwsh
        run: ./scripts/bootstrap-ffmpeg.ps1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - run: cargo build --release --locked
      - name: Verify FFmpeg is statically linked
        shell: pwsh
        run: |
          $dependencies = (dumpbin /dependents target/release/beam.exe) -join "`n"
          $dependencies
          if ($dependencies -match '(?i)(avcodec|avfilter|avformat|avutil|swscale|x264|x265|SvtAv1Enc).*\.dll') {
            throw "beam.exe has a dynamic FFmpeg or codec dependency"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: beam-windows-x64
          path: target/release/beam.exe

  linux-wayland-x64:
    name: Linux x64 Wayland
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 3723ec118c8354290925feb58d021a9205a3e772
          path: .vcpkg
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang cmake nasm pkg-config libdrm-dev \
            libgtk-3-dev libayatana-appindicator3-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libwayland-dev libxkbcommon-dev \
            libx11-dev libxtst-dev libxdo-dev
      - name: Build static FFmpeg dependencies
        run: ./scripts/bootstrap-ffmpeg.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - run: cargo build --release --locked
      - name: Verify FFmpeg is statically linked
        run: |
          dependencies="$(ldd target/release/beam)"
          echo "$dependencies"
          ! grep -Eiq 'lib(avcodec|avfilter|avformat|avutil|swscale|x264|x265|SvtAv1Enc).*\.so' <<< "$dependencies"
      - name: Build AppImage
        run: |
          appdir=target/release/Beam.AppDir
          mkdir -p "$appdir/usr/bin" "$appdir/usr/Resources/web"
          cp target/release/beam "$appdir/usr/bin/beam"
          cp -R web/dist "$appdir/usr/Resources/web/dist"
          cp assets/tray.svg "$appdir/Beam.svg"

          cat > "$appdir/AppRun" <<'EOF'
          #!/bin/sh
          exec "$APPDIR/usr/bin/beam" "$@"
          EOF
          chmod +x "$appdir/AppRun"

          cat > "$appdir/Beam.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Beam
          Exec=beam
          Icon=Beam
          Categories=Utility;
          Terminal=false
          EOF

          curl --fail --location --retry 3 \
            --output appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run \
            "$appdir" target/release/Beam-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: beam-linux-wayland-x64
          path: target/release/Beam-x86_64.AppImage

  macos-arm64:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 3723ec118c8354290925feb58d021a9205a3e772
          path: .vcpkg
      - name: Install native dependencies
        run: brew install pkg-config
      - name: Build static FFmpeg dependencies
        run: ./scripts/bootstrap-ffmpeg.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - run: cargo install cargo-bundle --version 0.11.0 --locked
      - run: cargo bundle --release --format osx
      - name: Verify FFmpeg is statically linked
        run: |
          binary=target/release/bundle/osx/Beam.app/Contents/MacOS/Beam
          dependencies="$(otool -L "$binary")"
          echo "$dependencies"
          ! grep -Eiq 'lib(avcodec|avfilter|avformat|avutil|swscale|x264|x265|SvtAv1Enc).*\.dylib' <<< "$dependencies"
      - name: Sign and package application
        run: |
          app=target/release/bundle/osx/Beam.app
          dmg=target/release/bundle/dmg/Beam.dmg
          staging=$(mktemp -d)

          # cargo-bundle copies a linker-signed executable into the completed app.
          # Re-sign the completed bundle so Info.plist and resources are sealed.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          cp -R "$app" "$staging/Beam.app"
          ln -s /Applications "$staging/Applications"
          mkdir -p "$(dirname "$dmg")"
          temporary_dmg="$dmg.tmp.dmg"
          rm -f "$temporary_dmg"
          hdiutil create -volname Beam -srcfolder "$staging" -ov -format UDZO "$temporary_dmg"
          mv -f "$temporary_dmg" "$dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: beam-macos-arm64
          path: target/release/bundle/dmg/Beam.dmg
