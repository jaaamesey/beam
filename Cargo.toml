[package]
name = "beam"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"

[profile.dev]
opt-level = 2

[package.metadata.bundle]
name = "Beam"
identifier = "com.beam.streaming"
category = "public.app-category.utilities"
resources = ["web/dist"]

[patch.crates-io]
ffmpeg-sys-next = { path = "vendor/ffmpeg-sys-next" }

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
bytes = "1"
dirs = "6"
display-info = "0.5"
enigo = { version = "0.2", features = ["wayland", "libei"] }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
open = "5"
opus = "0.4"
pinray = "0.2"
rand = "0.9"
rcgen = "0.13"
resvg = "0.48"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.24"
subtle = "2"
webrtc = "0.17"
ffmpeg-next = { version = "9", default-features = false, features = [
    "codec",
    "format",
    "filter",
    "software-scaling",
    "build",
    "build-lib-x264",
    "build-lib-x265",
] }
ffmpeg-sys-next = { version = "9", default-features = false, features = [
    "build",
    "build-portable",
    "build-videotoolbox",
    "build-vaapi",
    "build-amf",
    "build-lib-d3d11va",
    "build-lib-dxva2",
    "build-license-gpl",
    "build-lib-x264",
    "build-lib-x265",
    "build-lib-svtav1",
] }

[target.'cfg(target_os = "macos")'.dependencies]
macos-accessibility-client = "0.0.2"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
ffmpeg-sys-next = { version = "9", default-features = false, features = ["build-nvenc"] }
