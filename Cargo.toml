[package]
name = "beam"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 2

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json"] }
bytes = "1"
dirs = "6"
open = "5"
rand = "0.9"
rav1e = "0.8"
scap = { package = "sc-cap", version = "0.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
subtle = "2"
webrtc = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { version = "0.11", default-features = false, features = ["cf", "cm", "cv", "vt"] }
